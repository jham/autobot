[package]
name = "autobot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Coordinates AUTO mode across Mitsubishi multi-split head units driven by esp105 boards"
license = "Apache-2.0"
authors = ["Jeff Hamilton"]
publish = false

[dependencies]
anyhow = "1"
# Pin the ESPHome API version so a crate update can't silently change the protocol.
esphome-client = { version = "0.2.1", default-features = false, features = ["api-1-16"] }
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util", "fs"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
