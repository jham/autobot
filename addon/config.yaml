name: autobot
version: "0.1.0"
slug: autobot
description: Keeps the head units on a Mitsubishi multi-split outdoor unit heating or cooling together
url: https://github.com/jham/autobot
arch:
  - aarch64
  - amd64
# Prebuilt by CI (.github/workflows/ci.yml); the Supervisor pulls it rather than building it.
image: ghcr.io/jham/autobot-{arch}
init: false
# mDNS (.local names) for the esp105 boards, and Matter later.
host_network: true
services:
  - mqtt:need
options:
  outdoor:
    - id: upstairs
      name: Upstairs
      unit: []
  arbiter: {}
schema:
  outdoor:
    - id: match(^[a-z0-9_]+$)
      name: str?
      start_offset: float(0,5)?
      min_run_min: float(1,240)?
      max_slice_min: float(1,480)?
      idle_switch_delay_min: float(0,60)?
      demand_ratio: float(1,10)?
      changeover_settle: float(0,600)?
      dry_weight: float(0.1,10)?
      idle_action: list(off|fan)?
      unit:
        - id: match(^[a-z0-9_]+$)
          name: str
          host: str
          port: port?
          encryption_key: password
          climate: str?
  arbiter:
    start_offset: float(0,5)?
    min_run_min: float(1,240)?
    max_slice_min: float(1,480)?
    idle_switch_delay_min: float(0,60)?
    demand_ratio: float(1,10)?
    changeover_settle: float(0,600)?
    dry_weight: float(0.1,10)?
    idle_action: list(off|fan)?
  tick: float(1,300)?
  adopt_external: bool?
  adopt_after: float(0,600)?
  auto_deadband: float(0,10)?
  min_temp: float(5,30)?
  max_temp: float(15,40)?
  log_level: list(trace|debug|info|warn|error)?
